name: Publish game + Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the playable game to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Wrap the game as an Android app (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Shezin's Flappy Bird" com.shezin.flappybird --web-dir site
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ShezinsFlappyBird.apk
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Shezin's Flappy Bird — Android app
          body: Download ShezinsFlappyBird.apk below and open it on your Android phone (allow "install unknown apps" when asked).
          files: ShezinsFlappyBird.apk
          make_latest: true
